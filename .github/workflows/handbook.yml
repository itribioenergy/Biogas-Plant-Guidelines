name: Build handbook
on:
  push:
    branches: [main]
    paths: ['content/**', 'web/**', 'scripts/**', 'assets/**', '.github/workflows/handbook.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: handbook-main
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install document dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk libreoffice-writer
          pip install python-docx==1.1.2 playwright==1.51.0 pymupdf==1.25.3 cairosvg==2.7.1
          python -m playwright install --with-deps chromium
      - name: Audit public source
        run: python scripts/source_audit.py
      - name: Build and validate
        if: ${{ hashFiles('scripts/build.py') != '' }}
        run: python scripts/build.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: handbook-v1
          path: |
            output/
            qa/
          if-no-files-found: warn
      - name: Save generated deliverables
        if: ${{ success() && hashFiles('output/Biogas-Plant-Health-Check-v1.pdf') != '' }}
        run: |
          git config user.name "Handbook Build"
          git config user.email "handbook-build@users.noreply.github.com"
          git add output web/downloads qa/report.json
          git diff --cached --quiet && exit 0
          git commit -m "build: export verified handbook PDF and DOCX [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
