name: Build handbook
on:
  push:
    branches: [main]
    paths: ['content/**', 'web/**', 'scripts/**', 'assets/**', '.github/workflows/handbook.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: handbook-main
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install document dependencies
        run: |
          printf 'https://archive.ubuntu.com/ubuntu\n' | sudo tee /etc/apt/apt-mirrors.txt
          sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update -qq
          sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y --no-install-recommends fonts-noto-cjk libreoffice-writer
          pip install --timeout 30 --retries 2 python-docx==1.1.2 playwright==1.51.0 pymupdf==1.25.3 cairosvg==2.7.1 Pillow==11.1.0
          timeout 300 python -m playwright install --with-deps chromium
      - name: Audit public source
        run: python scripts/source_audit.py
      - name: Build and validate
        if: ${{ hashFiles('scripts/build.py') != '' }}
        run: python scripts/build.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: handbook-v1
          path: |
            output/
            qa/
          if-no-files-found: warn
      - name: Save generated deliverables
        if: ${{ success() && hashFiles('output/Biogas-Plant-Health-Check-v1.pdf') != '' }}
        run: |
          git config user.name "Handbook Build"
          git config user.email "handbook-build@users.noreply.github.com"
          git add output web/downloads qa/report.json qa/contact.png qa/page-*.png qa/source-metadata.json
          git diff --cached --quiet && exit 0
          git commit -m "build: export verified handbook PDF and DOCX [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Package Pages preview
        uses: actions/upload-pages-artifact@v3
        with:
          path: qa/site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Deploy preview
        id: deployment
        uses: actions/deploy-pages@v4
