<svg xmlns="http://www.w3.org/2000/svg" width="680" height="230" viewBox="0 0 680 230" role="img" aria-label="出料與接收端"><title>出料與接收端</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2F6B45"/></marker></defs><rect width="680" height="230" rx="16" fill="#F3F5F6"/><g font-family="Noto Sans CJK TC, Noto Sans TC, Microsoft JhengHei, sans-serif"><rect x="25" y="50" width="180" height="80" rx="12" fill="#DDEEDF" stroke="#4FA36C" stroke-width="2"/><text x="115" y="84" font-size="18" fill="#303A36" text-anchor="middle">厭氧槽</text><text x="115" y="108" font-size="18" fill="#303A36" text-anchor="middle">看液位趨勢</text><path d="M205 90 L242 90" stroke="#2F6B45" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="250" y="50" width="180" height="80" rx="12" fill="#DDEEDF" stroke="#4FA36C" stroke-width="2"/><text x="340" y="84" font-size="18" fill="#303A36" text-anchor="middle">出料系統</text><text x="340" y="108" font-size="18" fill="#303A36" text-anchor="middle">看流量與警報</text><path d="M430 90 L467 90" stroke="#2F6B45" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="475" y="50" width="180" height="80" rx="12" fill="#DDEEDF" stroke="#4FA36C" stroke-width="2"/><text x="565" y="84" font-size="18" fill="#303A36" text-anchor="middle">接收／處理</text><text x="565" y="108" font-size="18" fill="#303A36" text-anchor="middle">看容量與去向</text><text x="340" y="190" font-size="18" fill="#303A36" text-anchor="middle">三段一起核對；不開槽、不拆管、不自行清堵。</text></g></svg>