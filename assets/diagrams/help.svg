<svg xmlns="http://www.w3.org/2000/svg" width="680" height="230" viewBox="0 0 680 230" role="img" aria-label="求援資料四要素"><title>求援資料四要素</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2F6B45"/></marker></defs><rect width="680" height="230" rx="16" fill="#F3F5F6"/><g font-family="Noto Sans CJK TC, Noto Sans TC, Microsoft JhengHei, sans-serif"><rect x="20" y="40" width="145" height="100" rx="12" fill="#DDEEDF" stroke="#4FA36C" stroke-width="2"/><text x="92.5" y="84" font-size="18" fill="#303A36" text-anchor="middle">在哪裡？</text><text x="92.5" y="108" font-size="18" fill="#303A36" text-anchor="middle">地址／入口</text><rect x="185" y="40" width="145" height="100" rx="12" fill="#DDEEDF" stroke="#4FA36C" stroke-width="2"/><text x="257.5" y="84" font-size="18" fill="#303A36" text-anchor="middle">發生什麼？</text><text x="257.5" y="108" font-size="18" fill="#303A36" text-anchor="middle">人員／危害</text><rect x="350" y="40" width="145" height="100" rx="12" fill="#DDEEDF" stroke="#4FA36C" stroke-width="2"/><text x="422.5" y="84" font-size="18" fill="#303A36" text-anchor="middle">什麼時候？</text><text x="422.5" y="108" font-size="18" fill="#303A36" text-anchor="middle">首次時間</text><rect x="515" y="40" width="145" height="100" rx="12" fill="#DDEEDF" stroke="#4FA36C" stroke-width="2"/><text x="587.5" y="84" font-size="18" fill="#303A36" text-anchor="middle">設備資料？</text><text x="587.5" y="108" font-size="18" fill="#303A36" text-anchor="middle">型號／警報</text><text x="340" y="195" font-size="19" fill="#303A36" text-anchor="middle">緊急情況先通報，不必等資料全部備齊。</text></g></svg>