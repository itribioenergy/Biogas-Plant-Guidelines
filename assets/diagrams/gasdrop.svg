<svg xmlns="http://www.w3.org/2000/svg" width="680" height="230" viewBox="0 0 680 230" role="img" aria-label="產氣下降判斷路徑"><title>產氣下降判斷路徑</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2F6B45"/></marker></defs><rect width="680" height="230" rx="16" fill="#F3F5F6"/><g font-family="Noto Sans CJK TC, Noto Sans TC, Microsoft JhengHei, sans-serif"><rect x="15" y="30" width="145" height="80" rx="12" fill="#DDEEDF" stroke="#4FA36C" stroke-width="2"/><text x="87.5" y="64" font-size="18" fill="#303A36" text-anchor="middle">① 比對紀錄</text><text x="87.5" y="88" font-size="18" fill="#303A36" text-anchor="middle">時間、單位</text><path d="M160 70 L180 70" stroke="#2F6B45" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="185" y="30" width="145" height="80" rx="12" fill="#DDEEDF" stroke="#4FA36C" stroke-width="2"/><text x="257.5" y="64" font-size="18" fill="#303A36" text-anchor="middle">② 看用氣</text><text x="257.5" y="88" font-size="18" fill="#303A36" text-anchor="middle">時數、儲氣</text><path d="M330 70 L350 70" stroke="#2F6B45" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="355" y="30" width="145" height="80" rx="12" fill="#DDEEDF" stroke="#4FA36C" stroke-width="2"/><text x="427.5" y="64" font-size="18" fill="#303A36" text-anchor="middle">③ 看生物端</text><text x="427.5" y="88" font-size="18" fill="#303A36" text-anchor="middle">進料、槽況</text><path d="M500 70 L520 70" stroke="#2F6B45" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="525" y="30" width="140" height="80" rx="12" fill="#DDEEDF" stroke="#4FA36C" stroke-width="2"/><text x="595" y="64" font-size="18" fill="#303A36" text-anchor="middle">④ 專業查核</text><text x="595" y="88" font-size="18" fill="#303A36" text-anchor="middle">氣路、設備</text><rect x="45" y="145" width="590" height="55" rx="12" fill="#FBE9E7" stroke="#C6413B" stroke-width="2"/><text x="340" y="178.5" font-size="18" fill="#303A36" text-anchor="middle">任何階段有警報或疑似洩漏 → 撤離並通報</text></g></svg>