<svg xmlns="http://www.w3.org/2000/svg" width="680" height="230" viewBox="0 0 680 230" role="img" aria-label="進料紀錄的三個重點"><title>進料紀錄的三個重點</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2F6B45"/></marker></defs><rect width="680" height="230" rx="16" fill="#F3F5F6"/><g font-family="Noto Sans CJK TC, Noto Sans TC, Microsoft JhengHei, sans-serif"><rect x="25" y="45" width="180" height="95" rx="12" fill="#DDEEDF" stroke="#4FA36C" stroke-width="2"/><text x="115" y="86.5" font-size="18" fill="#303A36" text-anchor="middle">進什麼？</text><text x="115" y="110.5" font-size="18" fill="#303A36" text-anchor="middle">料源與近期變更</text><path d="M205 92 L242 92" stroke="#2F6B45" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="250" y="45" width="180" height="95" rx="12" fill="#DDEEDF" stroke="#4FA36C" stroke-width="2"/><text x="340" y="86.5" font-size="18" fill="#303A36" text-anchor="middle">進多少？</text><text x="340" y="110.5" font-size="18" fill="#303A36" text-anchor="middle">實際量與濃度</text><path d="M430 92 L467 92" stroke="#2F6B45" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="475" y="45" width="180" height="95" rx="12" fill="#DDEEDF" stroke="#4FA36C" stroke-width="2"/><text x="565" y="86.5" font-size="18" fill="#303A36" text-anchor="middle">何時進？</text><text x="565" y="110.5" font-size="18" fill="#303A36" text-anchor="middle">時間與頻率</text><text x="340" y="190" font-size="18" fill="#303A36" text-anchor="middle">三項一起記，才能對照後續槽況與產氣變化。</text></g></svg>