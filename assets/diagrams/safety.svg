<svg xmlns="http://www.w3.org/2000/svg" width="680" height="230" viewBox="0 0 680 230" role="img" aria-label="危險時的三個動作"><title>危險時的三個動作</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2F6B45"/></marker></defs><rect width="680" height="230" rx="16" fill="#F3F5F6"/><g font-family="Noto Sans CJK TC, Noto Sans TC, Microsoft JhengHei, sans-serif"><rect x="25" y="40" width="180" height="100" rx="12" fill="#FBE9E7" stroke="#C6413B" stroke-width="2"/><text x="115" y="84" font-size="18" fill="#303A36" text-anchor="middle">① 離開危險區</text><text x="115" y="108" font-size="18" fill="#303A36" text-anchor="middle">不留場找原因</text><path d="M205 90 L242 90" stroke="#2F6B45" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="250" y="40" width="180" height="100" rx="12" fill="#FBE9E7" stroke="#C6413B" stroke-width="2"/><text x="340" y="84" font-size="18" fill="#303A36" text-anchor="middle">② 安全處通報</text><text x="340" y="108" font-size="18" fill="#303A36" text-anchor="middle">緊急撥 119</text><path d="M430 90 L467 90" stroke="#2F6B45" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="475" y="40" width="180" height="100" rx="12" fill="#FBE9E7" stroke="#C6413B" stroke-width="2"/><text x="565" y="84" font-size="18" fill="#303A36" text-anchor="middle">③ 等待專業處置</text><text x="565" y="108" font-size="18" fill="#303A36" text-anchor="middle">不自行返回</text><text x="340" y="195" font-size="20" fill="#C6413B" text-anchor="middle">有人倒地也不要貿然進入危險區救援。</text></g></svg>