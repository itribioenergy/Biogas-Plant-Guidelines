<svg xmlns="http://www.w3.org/2000/svg" width="680" height="260" viewBox="0 0 680 260" role="img" aria-label="發不動的安全排查流程"><title>發不動的安全排查流程</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2F6B45"/></marker></defs><rect width="680" height="260" rx="16" fill="#F3F5F6"/><g font-family="Noto Sans CJK TC, Noto Sans TC, Microsoft JhengHei, sans-serif"><rect x="240" y="10" width="200" height="50" rx="12" fill="#DDEEDF" stroke="#4FA36C" stroke-width="2"/><text x="340" y="41" font-size="18" fill="#303A36" text-anchor="middle">記錄首次警報</text><path d="M280 60 L170 100" stroke="#2F6B45" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M400 60 L510 100" stroke="#2F6B45" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="45" y="105" width="250" height="65" rx="12" fill="#DDEEDF" stroke="#4FA36C" stroke-width="2"/><text x="170" y="131.5" font-size="18" fill="#303A36" text-anchor="middle">無反應</text><text x="170" y="155.5" font-size="18" fill="#303A36" text-anchor="middle">記錄控制／許可狀態</text><rect x="385" y="105" width="250" height="65" rx="12" fill="#DDEEDF" stroke="#4FA36C" stroke-width="2"/><text x="510" y="131.5" font-size="18" fill="#303A36" text-anchor="middle">有轉但未起動</text><text x="510" y="155.5" font-size="18" fill="#303A36" text-anchor="middle">記錄供氣／起動反應</text><path d="M170 170 L280 195" stroke="#2F6B45" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M510 170 L400 195" stroke="#2F6B45" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="190" y="195" width="300" height="45" rx="12" fill="#FFF3D3" stroke="#B27600" stroke-width="2"/><text x="340" y="223.5" font-size="18" fill="#303A36" text-anchor="middle">停止反覆嘗試，聯絡維護商</text></g></svg>