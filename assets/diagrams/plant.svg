<svg xmlns="http://www.w3.org/2000/svg" width="680" height="250" viewBox="0 0 680 250" role="img" aria-label="物料與氣體流程示意"><title>物料與氣體流程示意</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2F6B45"/></marker></defs><rect width="680" height="250" rx="16" fill="#F3F5F6"/><g font-family="Noto Sans CJK TC, Noto Sans TC, Microsoft JhengHei, sans-serif"><rect x="20" y="20" width="170" height="52" rx="12" fill="#DDEEDF" stroke="#4FA36C" stroke-width="2"/><text x="105" y="52" font-size="18" fill="#303A36" text-anchor="middle">進料／前處理</text><path d="M190 46 L245 46" stroke="#2F6B45" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="250" y="20" width="175" height="52" rx="12" fill="#DDEEDF" stroke="#4FA36C" stroke-width="2"/><text x="337.5" y="52" font-size="18" fill="#303A36" text-anchor="middle">厭氧槽</text><path d="M338 72 L338 125" stroke="#2F6B45" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="338" y="89.5" font-size="16" fill="#303A36" text-anchor="middle">沼氣</text><rect x="250" y="130" width="175" height="58" rx="12" fill="#DDEEDF" stroke="#4FA36C" stroke-width="2"/><text x="337.5" y="165" font-size="18" fill="#303A36" text-anchor="middle">氣體處理／儲氣</text><path d="M425 159 L480 159" stroke="#2F6B45" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="485" y="130" width="175" height="58" rx="12" fill="#DDEEDF" stroke="#4FA36C" stroke-width="2"/><text x="572.5" y="165" font-size="18" fill="#303A36" text-anchor="middle">發電機 → 電力</text><path d="M425 46 L480 46" stroke="#2F6B45" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="452.5" y="37" font-size="16" fill="#303A36" text-anchor="middle">出料</text><rect x="485" y="20" width="175" height="52" rx="12" fill="#DDEEDF" stroke="#4FA36C" stroke-width="2"/><text x="572.5" y="52" font-size="18" fill="#303A36" text-anchor="middle">沼渣沼液處理</text><text x="340" y="225" font-size="17" fill="#303A36" text-anchor="middle">氣體處理含脫硫、脫水；儲氣位置與處理順序依本場設計。</text></g></svg>