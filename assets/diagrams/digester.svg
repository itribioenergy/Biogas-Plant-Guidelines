<svg xmlns="http://www.w3.org/2000/svg" width="680" height="230" viewBox="0 0 680 230" role="img" aria-label="同視角正常與異常對照，非液位設定圖"><title>同視角正常與異常對照，非液位設定圖</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2F6B45"/></marker></defs><rect width="680" height="230" rx="16" fill="#F3F5F6"/><g font-family="Noto Sans CJK TC, Noto Sans TC, Microsoft JhengHei, sans-serif"><rect x="65" y="52" width="180" height="106" rx="18" fill="#fff" stroke="#2F6B45" stroke-width="3"/><path d="M68 112h174v25q0 18-18 18h-138q-18 0-18-18z" fill="#DDEEDF"/><text x="155" y="35" font-size="20" fill="#303A36" text-anchor="middle">本場正常基準</text><text x="155" y="192" font-size="17" fill="#303A36" text-anchor="middle">讀值穩定、無異常警報</text><rect x="435" y="52" width="180" height="106" rx="18" fill="#fff" stroke="#2F6B45" stroke-width="3"/><path d="M438 85h174v25q0 18-18 18h-138q-18 0-18-18z" fill="#FFF3D3"/><text x="525" y="35" font-size="20" fill="#303A36" text-anchor="middle">需追查的變化</text><text x="525" y="192" font-size="17" fill="#303A36" text-anchor="middle">液位／泡沫／趨勢改變</text><text x="340" y="90" font-size="17" fill="#303A36" text-anchor="middle">對照</text><text x="340" y="122" font-size="17" fill="#303A36" text-anchor="middle">趨勢</text></g></svg>