<svg xmlns="http://www.w3.org/2000/svg" width="680" height="230" viewBox="0 0 680 230" role="img" aria-label="氣袋外觀只是線索，需搭配壓力"><title>氣袋外觀只是線索，需搭配壓力</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2F6B45"/></marker></defs><rect width="680" height="230" rx="16" fill="#F3F5F6"/><g font-family="Noto Sans CJK TC, Noto Sans TC, Microsoft JhengHei, sans-serif"><path d="M35 140 Q105 45 175 140Z" fill="#DDEEDF" stroke="#2F6B45" stroke-width="3"/><path d="M255 140 Q325 110 395 140Z" fill="#FFF3D3" stroke="#B27600" stroke-width="3"/><path d="M475 140 Q530 -20 615 70L645 140Z" fill="#FBE9E7" stroke="#C6413B" stroke-width="3"/><text x="105" y="180" font-size="17" fill="#303A36" text-anchor="middle">依原廠正常外形</text><text x="325" y="180" font-size="17" fill="#303A36" text-anchor="middle">變扁：先看收支</text><text x="560" y="180" font-size="17" fill="#303A36" text-anchor="middle">異常變形：通報</text><text x="340" y="215" font-size="17" fill="#303A36" text-anchor="middle">示意非比例圖；雙膜外形不等於內膜儲量。</text></g></svg>