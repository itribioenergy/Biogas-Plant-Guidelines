<svg xmlns="http://www.w3.org/2000/svg" width="680" height="230" viewBox="0 0 680 230" role="img" aria-label="氣質與量測位置"><title>氣質與量測位置</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2F6B45"/></marker></defs><rect width="680" height="230" rx="16" fill="#F3F5F6"/><g font-family="Noto Sans CJK TC, Noto Sans TC, Microsoft JhengHei, sans-serif"><rect x="25" y="40" width="180" height="100" rx="12" fill="#DDEEDF" stroke="#4FA36C" stroke-width="2"/><text x="115" y="84" font-size="18" fill="#303A36" text-anchor="middle">製程氣體</text><text x="115" y="108" font-size="18" fill="#303A36" text-anchor="middle">甲烷／硫化氫</text><rect x="250" y="40" width="180" height="100" rx="12" fill="#DDEEDF" stroke="#4FA36C" stroke-width="2"/><text x="340" y="84" font-size="18" fill="#303A36" text-anchor="middle">供機組條件</text><text x="340" y="108" font-size="18" fill="#303A36" text-anchor="middle">依原廠允收規格</text><rect x="475" y="40" width="180" height="100" rx="12" fill="#FFF3D3" stroke="#B27600" stroke-width="2"/><text x="565" y="84" font-size="18" fill="#303A36" text-anchor="middle">作業環境</text><text x="565" y="108" font-size="18" fill="#303A36" text-anchor="middle">人員暴露風險</text><text x="340" y="190" font-size="17" fill="#303A36" text-anchor="middle">三者用途不同；不能用製程氣體讀值證明作業環境安全。</text></g></svg>