<svg xmlns="http://www.w3.org/2000/svg" width="680" height="230" viewBox="0 0 680 230" role="img" aria-label="停機事件的三項關鍵資訊"><title>停機事件的三項關鍵資訊</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2F6B45"/></marker></defs><rect width="680" height="230" rx="16" fill="#F3F5F6"/><g font-family="Noto Sans CJK TC, Noto Sans TC, Microsoft JhengHei, sans-serif"><rect x="25" y="45" width="180" height="95" rx="12" fill="#DDEEDF" stroke="#4FA36C" stroke-width="2"/><text x="115" y="86.5" font-size="18" fill="#303A36" text-anchor="middle">第一個警報</text><text x="115" y="110.5" font-size="18" fill="#303A36" text-anchor="middle">不是最後一個</text><path d="M205 92 L242 92" stroke="#2F6B45" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="250" y="45" width="180" height="95" rx="12" fill="#DDEEDF" stroke="#4FA36C" stroke-width="2"/><text x="340" y="86.5" font-size="18" fill="#303A36" text-anchor="middle">停機前讀值</text><text x="340" y="110.5" font-size="18" fill="#303A36" text-anchor="middle">負載、供氣、溫度</text><path d="M430 92 L467 92" stroke="#2F6B45" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="475" y="45" width="180" height="95" rx="12" fill="#DDEEDF" stroke="#4FA36C" stroke-width="2"/><text x="565" y="86.5" font-size="18" fill="#303A36" text-anchor="middle">專業判定</text><text x="565" y="110.5" font-size="18" fill="#303A36" text-anchor="middle">原因確認後復歸</text><text x="340" y="190" font-size="19" fill="#C6413B" text-anchor="middle">保護設定不自行調高，聯鎖不自行取消。</text></g></svg>