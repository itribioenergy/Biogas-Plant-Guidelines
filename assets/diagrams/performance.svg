<svg xmlns="http://www.w3.org/2000/svg" width="680" height="245" viewBox="0 0 680 245" role="img" aria-label="發電量下降分成時數與功率"><title>發電量下降分成時數與功率</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2F6B45"/></marker></defs><rect width="680" height="245" rx="16" fill="#F3F5F6"/><g font-family="Noto Sans CJK TC, Noto Sans TC, Microsoft JhengHei, sans-serif"><rect x="240" y="15" width="200" height="55" rx="12" fill="#DDEEDF" stroke="#4FA36C" stroke-width="2"/><text x="340" y="48.5" font-size="18" fill="#303A36" text-anchor="middle">同期間發電量減少</text><path d="M280 70 L180 105" stroke="#2F6B45" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M400 70 L500 105" stroke="#2F6B45" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="45" y="110" width="270" height="70" rx="12" fill="#DDEEDF" stroke="#4FA36C" stroke-width="2"/><text x="180" y="139" font-size="18" fill="#303A36" text-anchor="middle">開得不夠久？</text><text x="180" y="163" font-size="18" fill="#303A36" text-anchor="middle">查停機／保養／供氣</text><rect x="365" y="110" width="270" height="70" rx="12" fill="#DDEEDF" stroke="#4FA36C" stroke-width="2"/><text x="500" y="139" font-size="18" fill="#303A36" text-anchor="middle">運轉功率偏低？</text><text x="500" y="163" font-size="18" fill="#303A36" text-anchor="middle">查氣質／負載／限制</text><text x="340" y="220" font-size="18" fill="#303A36" text-anchor="middle">先對齊電表口徑與統計期間，再比較。</text></g></svg>