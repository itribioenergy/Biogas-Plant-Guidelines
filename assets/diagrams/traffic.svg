<svg xmlns="http://www.w3.org/2000/svg" width="680" height="230" viewBox="0 0 680 230" role="img" aria-label="正常、注意、危險三種行動"><title>正常、注意、危險三種行動</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2F6B45"/></marker></defs><rect width="680" height="230" rx="16" fill="#F3F5F6"/><g font-family="Noto Sans CJK TC, Noto Sans TC, Microsoft JhengHei, sans-serif"><rect x="20" y="35" width="200" height="110" rx="12" fill="#E8F4EA" stroke="#4FA36C" stroke-width="2"/><text x="120" y="84" font-size="18" fill="#303A36" text-anchor="middle">正常｜持續記錄</text><text x="120" y="108" font-size="18" fill="#303A36" text-anchor="middle">符合本場確認基準</text><rect x="240" y="35" width="200" height="110" rx="12" fill="#FFF3D3" stroke="#B27600" stroke-width="2"/><text x="340" y="84" font-size="18" fill="#303A36" text-anchor="middle">注意｜記錄通報</text><text x="340" y="108" font-size="18" fill="#303A36" text-anchor="middle">偏離常態或未知</text><rect x="460" y="35" width="200" height="110" rx="12" fill="#FBE9E7" stroke="#C6413B" stroke-width="2"/><text x="560" y="84" font-size="18" fill="#303A36" text-anchor="middle">危險｜撤離求援</text><text x="560" y="108" font-size="18" fill="#303A36" text-anchor="middle">警報或危險徵兆</text><text x="340" y="192" font-size="18" fill="#303A36" text-anchor="middle">三種狀態都有文字提示；未知不能勾成正常。</text></g></svg>